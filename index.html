<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 New Year Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="scene">
  <div class="book-wrapper" id="book-wrapper">
    <div class="book" id="book">
      <div class="board back-cover"></div>
      <div class="spine"></div>

      <div class="page right-page">
        <div class="page-frame">
          <canvas class="margin-canvas"></canvas>
          <div class="page-content" id="page-right">
            <img src="04.png" alt="Enter the Year of the Horse poster" class="img-top">
            <canvas class="ui-canvas"></canvas>
          </div>
        </div>
      </div>
      <div class="page-block-edge"></div>

      <div class="page left-page-wrapper">
        <div class="page left-page-content">
          <div class="page-frame">
          <canvas class="margin-canvas"></canvas>
            <div class="page-content" id="page-left">
              <img src="1.png" alt="QR code blessing poster" class="img-top">
              <canvas class="ui-canvas"></canvas>
            </div>
          </div>
        </div>
        <div class="page left-page-back"></div>
      </div>

      <div class="front-cover-wrapper">
        <div class="front-cover-face">
          <canvas class="cover-art" id="cover-canvas" aria-label="元旦快樂 · 馬 · 2026"></canvas>
          
        </div>
        <div class="front-cover-inside"></div>
        <div class="cover-edge"></div>
      </div>
    </div>
  </div>
</div>
<p class="hint">Hover the book to open · move across a page to scan</p>
<script src="horse.js?v=12"></script>
<script src="script.js?v=12"></script>
<script src="background.js?v=12"></script>
</body>
</html>
